[package]
name = "lumen-core"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp", "ico", "tga", "pnm"] }
rayon = "=1.10.0"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kamadak-exif = "0.5"

[dev-dependencies]
tempfile = "=3.10.1"
